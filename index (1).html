<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>電話メモ</title>
<style>
  body { margin:0; font-family:-apple-system,sans-serif; background:#111; color:#eee; }
  #top { padding:12px; display:flex; gap:10px; }
  button { flex:1; font-size:22px; padding:18px; border:0; border-radius:12px; }
  #btn { background:#2e7d32; color:#fff; }
  #btn.on { background:#c62828; }
  #setBtn { flex:0 0 70px; font-size:14px; background:#444; color:#ddd; }
  #status { padding:0 14px; font-size:14px; color:#aaa; }
  #now { margin:10px 12px; padding:12px; min-height:60px; background:#222; border-radius:10px; font-size:20px; color:#ffd54f; }
  #log { padding:0 14px 40px; font-size:17px; line-height:1.6; }
  .ng { color:#ef9a9a; }
</style>
</head>
<body>
<div id="top">
  <button id="btn">● 開始</button>
  <button id="setBtn">設定</button>
</div>
<div id="status">停止中</div>
<div id="now"></div>
<div id="log"></div>

<script>
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzHTxxl878ZeRF61VmBoguyrWoFHm9lcxep2r0TotC-UBGsvPolJAvUkD42uZN3W-k1/exec';
let url = DEFAULT_URL;
try { url = localStorage.getItem('memoUrl') || DEFAULT_URL; } catch(e) {}

const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
const nowEl = document.getElementById('now');
const logEl = document.getElementById('log');

document.getElementById('setBtn').onclick = () => {
  const v = prompt('送り先のURL（Apps Scriptの /exec で終わるURL）を貼り付けてください', url);
  if (v !== null) { url = v.trim(); try { localStorage.setItem('memoUrl', url); } catch(e) {} }
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { statusEl.textContent = 'このブラウザは音声認識に対応していません（Safariで開いてください）'; btn.disabled = true; }

let rec = null, running = false, wakeLock = null;

function addLog(text, ok) {
  const d = document.createElement('div');
  const t = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  d.textContent = t + '　' + text + (ok ? '' : '（未送信）');
  if (!ok) d.className = 'ng';
  logEl.prepend(d);
}

async function send(text) {
  if (!url) { addLog(text, false); statusEl.textContent = '「設定」で送り先URLを入れてください'; return; }
  try {
    await fetch(url, { method:'POST', mode:'no-cors', body:text });
    addLog(text, true);
  } catch (e) {
    addLog(text, false);
  }
}

function startRec() {
  rec = new SR();
  rec.lang = 'ja-JP';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { const t = r[0].transcript.trim(); if (t) send(t); }
      else interim += r[0].transcript;
    }
    nowEl.textContent = interim;
  };
  rec.onerror = (e) => {
    if (e.error === 'service-not-allowed' || e.error === 'not-allowed') {
      paused = true;
      statusEl.textContent = '止まりました。画面のどこかをタップすると再開します';
      document.body.style.background = '#3a2a00';
    } else {
      statusEl.textContent = 'エラー: ' + e.error + '（自動で再開します）';
    }
  };
  rec.onend = () => {
    if (running && !paused) setTimeout(() => { try { startRec(); } catch(e) {} }, 300);
  };
  rec.start();
  paused = false;
  document.body.style.background = '#111';
  statusEl.textContent = '聞き取り中…';
}

let paused = false;
// 止まったとき、画面タップで再開（iPhoneはタップの瞬間でないと開始できない）
document.addEventListener('click', (ev) => {
  if (ev.target === btn || ev.target.id === 'setBtn') return;
  if (running && paused) { try { startRec(); } catch(e) {} }
});

btn.onclick = () => {
  if (!running) {
    running = true; btn.textContent = '■ 停止'; btn.classList.add('on');
    startRec();  // タップの瞬間にすぐ開始する（先に他の処理を挟まない）
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => wakeLock = w).catch(() => {}); } catch(e) {}
  } else {
    running = false; btn.textContent = '● 開始'; btn.classList.remove('on');
    try { rec && rec.stop(); } catch(e) {}
    try { wakeLock && wakeLock.release(); } catch(e) {}
    nowEl.textContent = ''; statusEl.textContent = '停止中';
  }
};
</script>
</body>
</html>
